<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lclreason — dashboard</title>
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e; --accent: #6c63ff; --text: #e2e8f0; --muted: #64748b; --green: #22c55e; --red: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  header span { color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 4px; }
  main { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 14px; }
  .stat .val { font-size: 28px; font-weight: 700; color: var(--text); }
  .stat .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 0 0 8px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 0; border-bottom: 1px solid var(--border); color: var(--text); font-size: 13px; vertical-align: top; }
  td:last-child { text-align: right; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(34,197,94,.15); color: var(--green); }
  .badge.err { background: rgba(239,68,68,.15); color: var(--red); }
  .chat-area { grid-column: 1 / -1; }
  .messages { height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; }
  .msg.assistant { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; }
  .msg.loading { color: var(--muted); }
  .input-row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 10px; color: var(--text); font-size: 13px; outline: none; cursor: pointer; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .truncate { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .full-width { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>lclreason</h1>
  <span><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></span>
  <span style="margin-left:auto;color:var(--muted)">local distributed reasoning</span>
</header>
<main>

  <!-- Stats -->
  <div class="card">
    <h2>Cluster</h2>
    <div class="stat-grid">
      <div class="stat"><div class="val" id="statNodes">—</div><div class="label">Healthy Nodes</div></div>
      <div class="stat"><div class="val" id="statCache">—</div><div class="label">Cache Entries</div></div>
      <div class="stat"><div class="val" id="statTotal">—</div><div class="label">Total Nodes</div></div>
      <div class="stat"><div class="val" id="statModels">—</div><div class="label">Models</div></div>
    </div>
  </div>

  <!-- Nodes -->
  <div class="card">
    <h2>Nodes</h2>
    <table>
      <thead><tr><th>ID</th><th>Address</th><th>Load</th><th>Status</th></tr></thead>
      <tbody id="nodeTable"><tr><td colspan="4" style="color:var(--muted)">loading…</td></tr></tbody>
    </table>
  </div>

  <!-- Chat -->
  <div class="card chat-area">
    <h2>Chat</h2>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <select id="chainSel">
        <option value="">default chain</option>
        <option value="research">research</option>
      </select>
      <input type="text" id="promptInput" placeholder="Ask anything…" />
      <button id="sendBtn" onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- Events -->
  <div class="card full-width">
    <h2>Recent Events</h2>
    <table>
      <thead><tr><th>ID</th><th>Kind</th><th>Model</th><th>Prompt</th><th>Duration</th></tr></thead>
      <tbody id="eventTable"><tr><td colspan="5" style="color:var(--muted)">loading…</td></tr></tbody>
    </table>
  </div>

</main>
<script>
async function poll() {
  try {
    const [health, nodes, models] = await Promise.all([
      fetch('/health').then(r=>r.json()),
      fetch('/v1/nodes').then(r=>r.json()),
      fetch('/v1/models').then(r=>r.json()),
    ]);

    document.getElementById('statusDot').style.background = '#22c55e';
    document.getElementById('statusText').textContent = 'online';
    document.getElementById('statNodes').textContent = health.nodes_healthy ?? '—';
    document.getElementById('statTotal').textContent = health.nodes_total ?? '—';
    document.getElementById('statCache').textContent = health.cache_size ?? '—';
    document.getElementById('statModels').textContent = (models.data||[]).length;

    const tbody = document.getElementById('nodeTable');
    if (!nodes || nodes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">no nodes registered</td></tr>';
    } else {
      tbody.innerHTML = nodes.map(n => `
        <tr>
          <td class="truncate">${n.id}</td>
          <td>${n.address}</td>
          <td>${(n.load*100).toFixed(0)}%</td>
          <td><span class="badge ${n.healthy?'ok':'err'}">${n.healthy?'healthy':'offline'}</span></td>
        </tr>`).join('');
    }
  } catch {
    document.getElementById('statusDot').style.background = '#ef4444';
    document.getElementById('statusText').textContent = 'offline';
  }
}

async function loadEvents() {
  try {
    const events = await fetch('/v1/events?limit=20').then(r=>r.json());
    const tbody = document.getElementById('eventTable');
    if (!events || events.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">no events yet</td></tr>';
      return;
    }
    tbody.innerHTML = events.map(e => `
      <tr>
        <td>${e.id}</td>
        <td><span class="badge ok">${e.kind}</span></td>
        <td>${e.model||'—'}</td>
        <td class="truncate">${(e.prompt||'').substring(0,60)}</td>
        <td>${e.duration_ms}ms</td>
      </tr>`).join('');
  } catch {}
}

async function sendChat() {
  const btn = document.getElementById('sendBtn');
  const input = document.getElementById('promptInput');
  const chain = document.getElementById('chainSel').value;
  const prompt = input.value.trim();
  if (!prompt) return;

  addMsg('user', prompt);
  input.value = '';
  btn.disabled = true;
  const loading = addMsg('assistant loading', '…thinking…');

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'llama3',
        chain: chain,
        messages: [{role:'user', content: prompt}]
      })
    });
    const data = await res.json();
    loading.remove();
    addMsg('assistant', data.choices?.[0]?.message?.content || JSON.stringify(data));
  } catch(e) {
    loading.remove();
    addMsg('assistant', 'Error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  const msgs = document.getElementById('messages');
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

document.getElementById('promptInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

poll();
loadEvents();
setInterval(poll, 5000);
setInterval(loadEvents, 10000);
</script>
</body>
</html>
